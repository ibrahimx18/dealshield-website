<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DealShield — Create Account</title>
<meta name="theme-color" content="#f8faf9">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Libraries -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/lucide-static@latest/font/lucide.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          forest: {
            900: '#061a0e',
            800: '#0a2415',
            700: '#0d2818',
            600: '#123a23',
            500: '#1a4d2e',
            400: '#2d6a4f',
            300: '#52b788',
            200: '#74c69d',
            100: '#95d5b2',
            50: '#b7e4c7',
          },
          leaf: {
            DEFAULT: '#40916c',
            light: '#52b788',
            bright: '#74c69d',
          },
          cream: '#f8faf9',
          mist: '#e8f5ee',
          positive: '#22C55E',
          warning: '#F59E0B',
          danger: '#EF4444',
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          display: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif'],
        },
        spacing: { '18': '4.5rem' },
        borderRadius: {
          sm: '6px',
          md: '10px',
          lg: '14px',
        },
        boxShadow: {
          sm: '0 1px 2px rgba(13,40,24,0.06)',
          md: '0 4px 12px rgba(13,40,24,0.08)',
          lg: '0 12px 40px rgba(13,40,24,0.10)',
        },
      }
    }
  };
</script>
<style>
:root {
  --color-bg: #f8faf9;
  --color-surface: #ffffff;
  --color-surface-elevated: #f0f7f2;
  --color-border: rgba(13,40,24,0.08);
  --color-border-strong: rgba(13,40,24,0.16);
  --color-accent: #2d6a4f;
  --color-accent-light: #52b788;
  --color-accent-bright: #74c69d;
  --color-text-primary: #0a1f12;
  --color-text-secondary: #3a5a44;
  --color-text-muted: #6b8f78;
  --color-danger: #EF4444;
  --color-positive: #22C55E;
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --space-5: 40px;
  --space-6: 56px;
  --space-7: 72px;
  --space-8: 96px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(13,40,24,0.06);
  --shadow-md: 0 4px 12px rgba(13,40,24,0.08);
  --shadow-lg: 0 12px 40px rgba(13,40,24,0.10);
  --font-sans: 'Inter', system-ui, sans-serif;
}
* { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { background-color: var(--color-bg); color: var(--color-text-primary); font-family: var(--font-sans); overflow-x: hidden; }
h1,h2,h3,h4,h5 { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.03em; }
.input-field { background: rgba(255,255,255,0.9); border: 1px solid rgba(13,40,24,0.16); border-radius: var(--radius-md); padding: 14px 16px; color: var(--color-text-primary); font-size: 15px; font-weight: 500; outline: none; width: 100%; transition: border-color 0.2s, box-shadow 0.2s; }
.input-field:focus { border-color: #2d6a4f; box-shadow: 0 0 0 3px rgba(82,183,136,0.15); }
.input-field::placeholder { color: var(--color-text-muted); }
.input-field.error { border-color: var(--color-danger); }
.input-with-icon { padding-left: 44px; }
.btn-primary { background: linear-gradient(135deg, #52b788 0%, #2d6a4f 100%); color: #ffffff; font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: var(--radius-md); border: none; cursor: pointer; transition: filter .2s, transform .15s, box-shadow .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary:hover { filter: brightness(1.05); box-shadow: 0 4px 20px rgba(45,106,79,0.3); transform: translateY(-1px); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
.link { color: var(--color-accent); text-decoration: underline; font-size: 14px; }
.error-msg { color: var(--color-danger); margin-top: 8px; font-size: 13px; }
.field-error { color: var(--color-danger); font-size: 12px; margin-top: 4px; }
.card { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
.input-wrap { position: relative; }
.input-wrap .icon-left { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); pointer-events: none; }
.pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); cursor: pointer; background: none; border: none; padding: 0; }
.pw-toggle:hover { color: var(--color-text-secondary); }
/* JS compatibility */
.gold-btn { background: linear-gradient(135deg, #52b788 0%, #2d6a4f 100%); color: #ffffff; font-weight: 700; transition: all 0.2s ease; }
.gold-gradient-text { color: var(--color-accent); }
.gradient-green { background: linear-gradient(135deg, #52b788 0%, #2d6a4f 50%, #1a4d2e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.gold-400 { color: var(--color-accent); }
.gold-500 { color: var(--color-accent); }
.gold-600 { color: var(--color-accent); }
.text-dark { color: #0a1f12; }
</style>
</head>
<body class="relative min-h-screen flex items-center justify-center">
<!-- 3D Art background -->
<div class="fixed inset-0 pointer-events-none" style="z-index:0;">
  <img src="assets/art/dealshield-hero.jpg" alt="" class="w-full h-full object-cover opacity-[0.06]">
  <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(248,250,249,0.85) 0%, rgba(248,250,249,0.7) 40%, rgba(248,250,249,0.92) 100%);"></div>
</div>

<header class="fixed top-0 inset-x-0 z-50 bg-white/70 backdrop-blur-sm border-b border-[var(--color-border)] p-4 flex items-center">
  <a href="/" class="flex items-center gap-2">
    <div class="w-8 h-8 rounded-lg border border-forest-400/40 flex items-center justify-center">
      <svg width="18" height="18" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 15L80 30v25c0 20-15 35-30 40-15-5-30-20-30-40V30z" fill="none" stroke="#2d6a4f" stroke-width="6"/>
        <text x="50" y="62" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="900" fill="#2d6a4f">DS</text>
      </svg>
    </div>
    <span class="font-bold text-[15px] text-forest-700 font-display">DealShield</span>
  </a>
</header>
<main class="w-full relative z-10 max-w-md px-4">
  <div class="card p-6 mt-24 mx-auto shadow-md">
    <h2 class="text-2xl font-bold text-forest-700 mb-1 text-center font-display">Create your DealShield account</h2>
    <p class="text-forest-600 text-sm text-center mb-5">Secure escrow for every transaction on dealshield.ng</p>
    <form id="register-form" class="space-y-4" novalidate>
      <!-- Full Name -->
      <div>
        <div class="input-wrap">
          <i data-lucide="user" class="icon-left w-4 h-4"></i>
          <input type="text" id="name" name="name" placeholder="Full name" class="input-field input-with-icon" required>
        </div>
        <div id="name-error" class="field-error hidden"></div>
      </div>
      <!-- Phone -->
      <div>
        <div class="input-wrap">
          <i data-lucide="phone" class="icon-left w-4 h-4"></i>
          <input type="tel" id="phone" name="phone" placeholder="Phone (e.g. 0801 234 5678)" class="input-field input-with-icon" required>
        </div>
        <div id="phone-error" class="field-error hidden"></div>
      </div>
      <!-- Email -->
      <div>
        <div class="input-wrap">
          <i data-lucide="mail" class="icon-left w-4 h-4"></i>
          <input type="email" id="email" name="email" placeholder="Email address" class="input-field input-with-icon" required>
        </div>
        <div id="email-error" class="field-error hidden"></div>
      </div>
      <!-- Password -->
      <div>
        <div class="input-wrap">
          <i data-lucide="lock" class="icon-left w-4 h-4"></i>
          <input type="password" id="password" name="password" placeholder="Password (min 8 characters)" class="input-field input-with-icon" required minlength="8" autocomplete="new-password">
          <button type="button" class="pw-toggle" onclick="togglePassword()" aria-label="Toggle password visibility">
            <i data-lucide="eye" id="pw-eye-icon" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="password-error" class="field-error hidden"></div>
      </div>
      <button type="submit" id="submit-btn" class="btn-primary w-full flex items-center justify-center">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        Register
      </button>
      <div id="error" class="error-msg hidden"></div>
      <div id="success" class="text-forest-500 text-sm text-center hidden"></div>
    </form>
    <div class="mt-5 text-center text-sm text-forest-600">
      Already have an account? <a href="/login.html" class="link">Log in</a>
    </div>
  </div>
  <p class="text-center text-xs text-forest-600 mt-4">
    By creating an account you agree to our
    <a href="/terms.html" class="link">Terms</a> &amp; <a href="/privacy.html" class="link">Privacy Policy</a>.
  </p>
</main>
<script>
  lucide.createIcons();

  function togglePassword() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('pw-eye-icon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.setAttribute('data-lucide', 'eye-off');
    } else {
      pw.type = 'password';
      icon.setAttribute('data-lucide', 'eye');
    }
    lucide.createIcons();
  }

  function clearErrors() {
    document.querySelectorAll('.field-error').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.input-field').forEach(el => el.classList.remove('error'));
    document.getElementById('error').classList.add('hidden');
    document.getElementById('success').classList.add('hidden');
  }

  function showFieldError(fieldId, message) {
    const errEl = document.getElementById(fieldId + '-error');
    const inputEl = document.getElementById(fieldId);
    errEl.textContent = message;
    errEl.classList.remove('hidden');
    inputEl.classList.add('error');
  }

  function validateForm(data) {
    let valid = true;
    if (!data.name || data.name.trim().length < 2) {
      showFieldError('name', 'Please enter your full name.');
      valid = false;
    }
    if (!data.phone || data.phone.trim().length < 7) {
      showFieldError('phone', 'Please enter a valid phone number.');
      valid = false;
    }
    if (!data.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      showFieldError('email', 'Please enter a valid email address.');
      valid = false;
    }
    if (!data.password || data.password.length < 8) {
      showFieldError('password', 'Password must be at least 8 characters.');
      valid = false;
    }
    return valid;
  }

  document.getElementById('register-form').addEventListener('submit', function(e) {
    e.preventDefault();
    clearErrors();

    const data = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    };

    if (!validateForm(data)) return;

    const btn = document.getElementById('submit-btn');
    const btnHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Creating account...';
    lucide.createIcons();

    fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
    .then(res => {
      return res.json().then(json => ({ ok: res.ok, status: res.status, json }));
    })
    .then(({ ok, json }) => {
      if (!ok) {
        throw new Error(json.message || json.detail || json.error || 'Registration failed. Please try again.');
      }
      if (json.access_token) {
        localStorage.setItem('access_token', json.access_token);
        const successEl = document.getElementById('success');
        successEl.textContent = 'Account created! Redirecting to verification...';
        successEl.classList.remove('hidden');
        setTimeout(() => { location.href = '/kyc.html'; }, 600);
      } else {
        throw new Error('Missing access token in response.');
      }
    })
    .catch(err => {
      const errorEl = document.getElementById('error');
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = btnHtml;
      lucide.createIcons();
    });
  });
</script>
</body>
</html>
